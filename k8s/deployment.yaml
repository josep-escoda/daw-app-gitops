# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-daw
  labels:
    app: webapp-daw
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-daw
  template:
    metadata:
      labels:
        app: webapp-daw
    spec:
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: webapp
          image: harbor.institut.cat/alumne-anna/webapp-daw:v1.0
          ports:
            - containerPort: 80
