# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-daw
  labels:
    app: webapp-daw
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-daw
  template:
    metadata:
      labels:
        app: webapp-daw
    spec:
      imagePullSecrets:
        - name: credencials-kube0
      containers:
        - name: webapp
          image: kube0.lacetania.cat/grup1/webapp-daw:487c626
          ports:
            - containerPort: 80
